# TLS server certificate request
# Adapted from https://pki-tutorial.readthedocs.io/en/latest/simple/server.conf.html
# The subjectAltName is taken from the SAN environment variable, e.g.
#   SAN=DNS:www.cmpe272.test,DNS:localhost,IP:127.0.0.1

[ default ]
SAN                     = DNS:www.cmpe272.test  # Default value if $SAN unset

[ req ]
default_bits            = 2048                  # RSA key size
encrypt_key             = no                    # Server key is unencrypted (Tomcat keystore protects it)
default_md              = sha256                # MD to use
utf8                    = yes                   # Input is UTF-8
string_mask             = utf8only              # Emit UTF-8 strings
prompt                  = no                    # Don't prompt for DN
distinguished_name      = server_dn             # DN template
req_extensions          = server_reqext         # Desired extensions

[ server_dn ]
0.domainComponent       = "test"
1.domainComponent       = "cmpe272"
organizationName        = "CMPE272 Lab"
organizationalUnitName  = "CMPE272 Lab Web Services"
commonName              = "www.cmpe272.test"

[ server_reqext ]
keyUsage                = critical,digitalSignature,keyEncipherment
extendedKeyUsage        = serverAuth,clientAuth
subjectKeyIdentifier    = hash
subjectAltName          = $ENV::SAN
